# .github/workflows/build-ipa.yml — builds an unsigned Stillread.ipa on every push to main.

name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Stillread.xcodeproj \
            -scheme Stillread \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Stillread.app Payload/
          zip -qry Stillread.ipa Payload
          ls -lh Stillread.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stillread-ipa
          path: Stillread.ipa
          retention-days: 30
