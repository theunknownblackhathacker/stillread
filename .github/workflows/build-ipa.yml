# .github/workflows/build-ipa.yml — builds an unsigned Stillread.ipa on every push to main.

name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Stillread.xcodeproj \
            -scheme Stillread \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Export localizable strings
        continue-on-error: true
        run: |
          xcodebuild -exportLocalizations \
            -project Stillread.xcodeproj \
            -localizationPath loc \
            -exportLanguage en \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO > export.log 2>&1 || tail -n 40 export.log

      - name: Publish build log to build-logs branch
        if: always()
        run: |
          mkdir logs
          find loc -name "*.xliff" -exec cp {} logs/ \; 2>/dev/null || true
          [ -f export.log ] && tail -n 40 export.log > logs/export-tail.txt || true
          {
            echo "Commit: $GITHUB_SHA"
            echo "Result: ${{ job.status }}"
            echo
            echo "== Errors and warnings in our sources =="
            grep -E "(error|warning): " build.log | grep "/Stillread/" | sort -u || true
            echo
            echo "== Other errors =="
            grep -E "error: " build.log | grep -v "/Stillread/" | sort -u | head -50 || true
            echo
            echo "== Last 80 lines =="
            tail -n 80 build.log || true
          } > logs/build-summary.txt
          cd logs
          git init -q -b build-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Build log for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-logs

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Stillread.app Payload/
          zip -qry Stillread.ipa Payload
          ls -lh Stillread.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stillread-ipa
          path: Stillread.ipa
          retention-days: 30

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Stillread.ipa \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Unsigned build of $GITHUB_SHA. Sign it with your own certificate to install." \
            --prerelease

      - name: Push IPA to builds branch
        run: |
          mkdir out
          cp Stillread.ipa out/
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Stillread.ipa
          git commit -q -m "IPA for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
