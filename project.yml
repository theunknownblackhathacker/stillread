# project.yml — XcodeGen spec. The build machine turns this into Stillread.xcodeproj.

name: Stillread

options:
  bundleIdPrefix: com.kevin
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Stillread:
    type: application
    platform: iOS
    sources:
      - path: Stillread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.stillread
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stillread
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  Stillread:
    build:
      targets:
        Stillread: all
